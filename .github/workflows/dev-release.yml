name: Dev Release
on: [push, workflow_dispatch]
env:
  BUILD_TYPE: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 2G
jobs:
  dev-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Audit direct struct field access
        run: |
          pip install libclang
          python dev/audit_direct_access_clang.py

      - name: Install ccache
        run: choco install ccache -y --no-progress

      - name: Get cache key date
        id: cache-date
        shell: bash
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache ccache builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-windows-release-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ccache-windows-release-

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Configure CMake
        run: cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DDEVELOPER_MODE=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Generate commit hash
        run: cmd /c MakeCommitHash.bat

      - name: Reset ccache stats
        run: ccache --zero-stats

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target REFramework

      - name: Show ccache stats
        run: ccache --show-stats --verbose

      - name: Compress REFramework
        run: |
          echo ${{github.sha}} > ${{github.workspace}}/reframework_revision.txt
          7z a ${{github.workspace}}/REFramework.zip ${{github.workspace}}/reframework_revision.txt
          7z a ${{github.workspace}}/REFramework.zip ${{github.workspace}}/build/bin/REFramework/dinput8.dll

      - name: Upload REFramework
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: REFramework
          path: ${{github.workspace}}/REFramework.zip
          if-no-files-found: error

  nightly-push:
    runs-on: windows-latest
    needs: [dev-release]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427
        with:
          path: ${{github.workspace}}/artifacts

      - name: Set padded run number
        run: |
          $paddedRunNumber = "{0:D5}" -f ${{ github.run_number }}
          echo "RUN_NUMBER=$paddedRunNumber" >> $env:GITHUB_ENV
        shell: powershell

      - name: Create Release
        uses: ncipollo/release-action@6c75be85e571768fa31b40abf38de58ba0397db5
        with:
          repo: REFramework-nightly
          owner: praydog
          token: ${{ secrets.REPO_TOKEN }}
          name: ${{format('REF Nightly {0} ({1})', env.RUN_NUMBER, github.sha)}}
          tag: ${{format('nightly-{0}-{1}', env.RUN_NUMBER, github.sha)}}
          artifacts: ${{github.workspace}}/artifacts/**/*.zip
          makeLatest: true
          bodyFile: ${{github.workspace}}/nightly-body.md
          allowUpdates: true
