name: Dev Release
on: workflow_dispatch
env:
  BUILD_TYPE: Release
jobs:
  dev-release:
    runs-on: windows-2022
    strategy:
      matrix:
        target: [RE2, RE2_TDB66, RE3, RE3_TDB67, RE4, RE7, RE7_TDB49, RE8, RE9, DMC5, MHRISE, SF6, DD2, MHWILDS, PRAGMATA, MHSTORIES3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Update submodules to tracked branch
        run: |
          git -C dependencies/imgui fetch origin '+refs/heads/master:refs/remotes/origin/master'
          git -C dependencies/imgui checkout -B master origin/master

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-ninja-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-ninja-

      - name: Cache sccache
        uses: actions/cache@v6
        with:
          path: C:\Users\runneradmin\AppData\Local\Mozilla\sccache\cache
          key: ${{ runner.os }}-sccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Configure sccache
        uses: mozilla/sccache-action@v0.0.11

      - name: Build with Ninja (sccache)
        shell: cmd
        run: |
          for /f "delims=" %%i in ('where sccache') do set SCCACHE_BIN=%%~dpi
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where ninja >nul 2>&1 || choco install ninja -y
          set PATH=C:\ProgramData\chocolatey\bin;%SCCACHE_BIN%;%PATH%
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DDEVELOPER_MODE=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          call MakeCommitHash.bat
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target ${{matrix.target}}

      - name: Compress release
        run: |
          echo ${{github.sha}} > ${{github.workspace}}/reframework_revision.txt
          echo none > ${{github.workspace}}/DELETE_OPENVR_API_DLL_IF_YOU_WANT_TO_USE_OPENXR
          7z a ${{github.workspace}}/${{matrix.target}}.zip ${{github.workspace}}/reframework_revision.txt
          7z a ${{github.workspace}}/${{matrix.target}}.zip ${{github.workspace}}/DELETE_OPENVR_API_DLL_IF_YOU_WANT_TO_USE_OPENXR
          7z a ${{github.workspace}}/${{matrix.target}}.zip ${{github.workspace}}/build/bin/${{matrix.target}}/dinput8.dll
          7z a ${{github.workspace}}/${{matrix.target}}.zip ${{github.workspace}}/dependencies/openvr/bin/win64/openvr_api.dll
          7z a ${{github.workspace}}/${{matrix.target}}.zip ${{github.workspace}}/build/_deps/openxr-build/src/loader/${{env.BUILD_TYPE}}/openxr_loader.dll
          7z a ${{github.workspace}}/${{matrix.target}}.zip ${{github.workspace}}/scripts
          7z rn ${{github.workspace}}/${{matrix.target}}.zip scripts reframework/autorun

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.target}}
          path: ${{github.workspace}}/${{matrix.target}}.zip
          if-no-files-found: error
    
  nightly-push:
    runs-on: windows-2022
    needs: [dev-release]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ${{github.workspace}}/artifacts

      - name: Set padded run number
        run: |
          $paddedRunNumber = "{0:D5}" -f ${{ github.run_number }}
          echo "RUN_NUMBER=$paddedRunNumber" >> $env:GITHUB_ENV
        shell: powershell

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          repo: REFramework-nightly
          owner: praydog
          token: ${{ secrets.REPO_TOKEN }}
          name: ${{format('REF Nightly {0} ({1})', env.RUN_NUMBER, github.sha)}}
          tag: ${{format('nightly-{0}-{1}', env.RUN_NUMBER, github.sha)}}
          artifacts: ${{github.workspace}}/artifacts/**/*.zip
          makeLatest: true
          bodyFile: ${{github.workspace}}/nightly-body.md
          allowUpdates: true
