name: Build PR
on: [push, pull_request, workflow_dispatch]
env:
  BUILD_TYPE: Release
jobs:
  build-pr:
    runs-on: windows-2022
    strategy:
      matrix:
        target: [RE4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update submodules to tracked branch
        run: |
          git -C dependencies/imgui fetch origin '+refs/heads/master:refs/remotes/origin/master'
          git -C dependencies/imgui checkout -B master origin/master

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-ninja-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-ninja-

      - name: Cache sccache
        uses: actions/cache@v6
        with:
          path: C:\Users\runneradmin\AppData\Local\Mozilla\sccache\cache
          key: ${{ runner.os }}-sccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Configure sccache
        uses: mozilla/sccache-action@v0.0.11

      - name: Build with Ninja (sccache)
        shell: cmd
        run: |
          for /f "delims=" %%i in ('where sccache') do set SCCACHE_BIN=%%~dpi
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where ninja >nul 2>&1 || choco install ninja -y
          set PATH=C:\ProgramData\chocolatey\bin;%SCCACHE_BIN%;%PATH%
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DDEVELOPER_MODE=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          call MakeCommitHash.bat
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target ${{matrix.target}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.target}}
          path: ${{github.workspace}}/build/bin/${{matrix.target}}/dinput8.dll
          if-no-files-found: error

